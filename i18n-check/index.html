<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>다국어 정적 페이지 화면 검증</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:system-ui,sans-serif; }
  .row { display:flex; gap:12px; padding:12px; align-items:flex-start; }
  #row1280 { flex-direction:column; }
  .item h2 { font-size:12px; margin:0 0 5px; color:#8ef; font-weight:700; }
  iframe { border:2px solid #8ef; background:#fff; display:block; }
</style>
</head>
<body>
<div class="row" id="row375"></div>
<div class="row" id="row1280"></div>
<script>
(function () {
  var sec = (new URLSearchParams(location.search).get('s') || '').replace(/[^a-z0-9-]/gi, '')
  var pages = [['en', '/en/'], ['ja', '/ja/'], ['ar', '/ar/']]
  ;[[375, 880, 'row375'], [1280, 880, 'row1280']].forEach(function (job) {
    pages.forEach(function (p) {
      var d = document.createElement('div'); d.className = 'item'
      var h = document.createElement('h2'); h.textContent = p[0] + ' ' + job[0] + (sec ? ' #' + sec : '')
      var f = document.createElement('iframe')
      f.width = job[0]; f.height = job[1]; f.src = p[1] + (sec ? '#' + sec : '')
      d.appendChild(h); d.appendChild(f)
      document.getElementById(job[2]).appendChild(d)
    })
  })
})()
</script>
</body>
</html>
